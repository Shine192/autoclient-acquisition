name: Outreach delivery timer
run-name: Delivery check · ${{ github.event_name }}

on:
  schedule:
    - cron: '2-57/5 * * * *'
  # Manual invocation tests this same reusable path without sending mail.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    if: vars.SHINE_DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/outreach.yml
    with:
      operation: ${{ github.event_name == 'schedule' && 'run' || 'status' }}
    secrets: inherit
