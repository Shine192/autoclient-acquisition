name: Outreach delivery timer

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

jobs:
  delivery:
    if: vars.SHINE_DELIVERY_ENABLED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/outreach.yml
    with:
      operation: run
    secrets: inherit
