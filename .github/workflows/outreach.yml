name: AutoClient Outreach

on:
  # The separate timer calls this same sender, preserving manual controls and
  # the shared production concurrency lock.
  workflow_call:
    inputs:
      operation:
        type: string
        default: status
  workflow_dispatch:
    inputs:
      operation:
        description: 'Scheduled sending needs completed handover, test, policy and campaign'
        type: choice
        default: status
        options: [status, dry-run, self-test, verify-test, activate, pause, resume, campaign, close, run, reconcile]
      item_id:
        description: 'Test ID or uncertain outbox ID, when needed'
        type: string
      policy_hash:
        description: 'Reviewed policy hash, required only for activate'
        type: string
      campaign_target:
        description: 'New campaign maximum attempts: 1–100'
        type: string
        default: '20'
      campaign_dates:
        description: 'Company-local weekdays, e.g. 2026-10-21,2026-10-22'
        type: string

permissions:
  contents: read

concurrency:
  group: shine-production-delivery
  cancel-in-progress: false

jobs:
  outreach:
    if: github.event_name == 'workflow_dispatch' || vars.SHINE_DELIVERY_ENABLED == 'true'
    name: Check approved outreach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install sender dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Run requested operation
        env:
          GH_TOKEN: ${{ github.token }}
          SHINE_LEDGER_KEY: ${{ secrets.SHINE_LEDGER_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SHINE_DELIVERY_ENABLED: ${{ vars.SHINE_DELIVERY_ENABLED }}
          SHINE_OPERATION: ${{ github.event_name == 'schedule' && 'run' || inputs.operation }}
          SHINE_ITEM_ID: ${{ inputs.item_id }}
          SHINE_POLICY_HASH: ${{ inputs.policy_hash }}
          SHINE_CAMPAIGN_TARGET: ${{ inputs.campaign_target }}
          SHINE_CAMPAIGN_DATES: ${{ inputs.campaign_dates }}
        run: python main.py "$SHINE_OPERATION"
